name: Deploy and Build All
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: club-production-deploy
  cancel-in-progress: false

jobs:
  build-api:
    uses: ./.github/workflows/build-api.yml

  build-client:
    uses: ./.github/workflows/build-client.yml

  deploy:
    needs: [build-api, build-client]
    uses: ./.github/workflows/deploy-production.yml
    permissions: {}
    secrets: inherit
