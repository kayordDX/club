name: Deploy Production
on:
  workflow_call:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require SSH host verification
        env:
          HOST_FINGERPRINT: ${{ secrets.HOST_FINGERPRINT }}
        run: test -n "$HOST_FINGERPRINT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          CLUB_IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'club' }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          fingerprint: ${{ secrets.HOST_FINGERPRINT }}
          command_timeout: 15m
          envs: CLUB_IMAGE_TAG,DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test -f .env
            docker compose --env-file .env config --quiet
            docker compose --env-file .env pull club-api club
            docker rollout --env-file .env --timeout 180 club-api
            docker rollout --env-file .env --timeout 180 club
            env_tmp=$(mktemp .env.XXXXXX)
            trap 'rm -f "$env_tmp"' EXIT
            awk '!/^[[:space:]]*(export[[:space:]]+)?CLUB_IMAGE_TAG[[:space:]]*=/' .env > "$env_tmp"
            printf 'CLUB_IMAGE_TAG=%s\n' "$CLUB_IMAGE_TAG" >> "$env_tmp"
            chmod --reference=.env "$env_tmp"
            mv "$env_tmp" .env
            docker image prune -f
