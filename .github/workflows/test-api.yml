name: Test API

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}

      # Testcontainers spins up both Postgres and Redis itself
      # (Docker is preinstalled on ubuntu-latest). csharpier comes from
      # mise.toml (dotnet:csharpier), installed below via the dotnet SDK.
      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Check formatting
        run: csharpier check .

      - name: dotnet test
        run: dotnet test
